<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angie</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0a0a0b;
      color: #e8e6e3;
      font-family: 'Cormorant Garamond', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      overflow-x: hidden;
    }
    canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .card { position: relative; z-index: 1; max-width: 400px; width: 100%; text-align: center; }
    h1 {
      font-family: 'Special Elite', monospace;
      font-weight: normal;
      font-size: 44px;
      margin: 0 0 36px;
      letter-spacing: 2px;
    }
    .mystery {
      font-family: 'Special Elite', monospace;
      font-size: 30px;
      letter-spacing: 8px;
      cursor: pointer;
      user-select: none;
      animation: flicker 4s infinite;
    }
    @keyframes flicker {
      0%, 92%, 100% { opacity: 1; }
      93% { opacity: 0.3; }
      94% { opacity: 1; }
      96% { opacity: 0.5; }
      97% { opacity: 1; }
    }
    .secret {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height .8s ease, opacity .8s ease, margin .8s ease;
      margin: 0;
    }
    .secret.show { max-height: 260px; opacity: 1; margin-top: 24px; }
    .secret blockquote {
      margin: 0 0 10px;
      font-size: 20px;
      font-style: italic;
      line-height: 1.45;
    }
    .secret .author {
      font-size: 14px;
      letter-spacing: 2px;
      color: #8a8885;
    }
    .links { margin-top: 44px; }
    a.link {
      display: block;
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid #e8e6e3;
      background: rgba(10,10,11,0.6);
      color: #e8e6e3;
      text-decoration: none;
      font-family: 'Special Elite', monospace;
      font-size: 15px;
      letter-spacing: 3px;
      transition: background .25s, color .25s;
    }
    a.link:hover { background: #e8e6e3; color: #0a0a0b; }
  </style>
</head>
<body>
  <canvas id="rain"></canvas>

  <div class="card">
    <h1>Angie</h1>

    <div class="mystery" id="mystery">0.0.0.0</div>

    <div class="secret" id="secret">
      <blockquote>“The most merciful thing in the world, I think, is the inability of the human mind to correlate all its contents. 
        We live on a placid island of ignorance in the midst of black seas of infinity, and it was not meant that we should voyage far.”</blockquote>
      <div class="author">— H. P. LOVECRAFT</div>
    </div>

    <div class="links">
      <a class="link" href="https://github.com/AngelicaIseni">GITHUB</a>
      <a class="link" href="https://open.spotify.com/user/nsi5acdq7ku8ss0yplp42rszi">SPOTIFY</a>
    </div>
  </div>

  <script>
    document.getElementById('mystery').addEventListener('click', () => {
      document.getElementById('secret').classList.toggle('show');
    });

    const c = document.getElementById('rain');
    const ctx = c.getContext('2d');
    const size = 16;
    let cols = [];
    function resize() {
      c.width = innerWidth; c.height = innerHeight;
      ctx.fillStyle = '#0a0a0b';
      ctx.fillRect(0, 0, c.width, c.height);
      cols = Array.from({ length: Math.ceil(c.width / size) },
        () => Math.floor(Math.random() * -c.height / size));
    }
    let last = 0;
    function draw(t) {
      requestAnimationFrame(draw);
      if (t - last < 70) return;
      last = t;
      ctx.fillStyle = 'rgba(10,10,11,0.18)';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.font = size + 'px "Special Elite", monospace';
      cols.forEach((y, i) => {
        const ch = Math.random() < 0.5 ? '0' : '1';
        ctx.fillStyle = Math.random() < 0.03
          ? 'rgba(232,230,227,0.6)'
          : 'rgba(200,200,205,0.18)';
        ctx.fillText(ch, i * size, y * size);
        cols[i] = (y * size > c.height && Math.random() > 0.975) ? 0 : y + 1;
      });
    }
    addEventListener('resize', resize);
    resize(); requestAnimationFrame(draw);
  </script>
</body>
</html>
